name: Probe Barrierefreiheit (temporär)
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-barrierefrei.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        gebiet: [berlin, hamburg, sachsen, bayern/oberbayern, nordrhein-westfalen/koeln-regbez]
    steps:
      - run: sudo apt-get install -y -q osmium-tool >/dev/null
      - run: curl -sSfL -o g.osm.pbf "https://download.geofabrik.de/europe/germany/${{ matrix.gebiet }}-latest.osm.pbf"
      - name: Auswertung
        run: |
          osmium tags-filter -o oev.osm.pbf g.osm.pbf \
            nw/public_transport=platform,station nw/railway=station,halt,platform nw/highway=bus_stop n/highway=elevator
          osmium export -f geojsonseq -o oev.geojsonseq oev.osm.pbf
          python3 - <<'PY'
          import json, collections
          c = collections.defaultdict(collections.Counter)
          for z in open('oev.geojsonseq'):
              p = json.loads(z.lstrip('\x1e'))['properties']
              if p.get('highway') == 'elevator': art = 'aufzug'
              elif p.get('railway') in ('station', 'halt') or p.get('public_transport') == 'station': art = 'bahnhof'
              elif p.get('highway') == 'bus_stop' or p.get('bus') == 'yes' and p.get('public_transport') == 'platform': art = 'bushalt'
              else: art = 'bahnsteig'
              c[art][p.get('wheelchair', '-')] += 1
          for art, z in c.items():
              n = sum(z.values()); m = n - z['-']
              print(f"{art:10} {n:7} gesamt, {m/n:5.0%} mit wheelchair: {dict(z.most_common(5))}")
          PY
