name: Datenbank-Aufbau sichern

# Schreibt den kompletten Aufbau der Datenbank (Tabellen, Funktionen, Rechte, Regeln, Trigger; keine Daten)
# als Migration nach supabase/migrations/0001_ausgangsstand.sql und committet sie in den Branch, auf dem
# der Lauf startet. Damit lässt sich dieselbe Datenbank später auf dem eigenen Server (Supabase selbst
# gehostet) aufbauen. Der Inhalt landet nur in der Datei, nicht im öffentlichen Protokoll.
# pg_dump läuft im Docker-Image postgres:17, damit die Version zur Datenbank passt (auch unter Forgejo).
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/schema.yml']

permissions:
  contents: write

concurrency:
  group: schema-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sichern:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Aufbau auslesen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ]; then echo "Secret SUPABASE_DB_URL fehlt"; exit 1; fi
          ziel=supabase/migrations/0001_ausgangsstand.sql
          mkdir -p supabase/migrations
          pg() { docker run --rm -i --network host -e DB="$SUPABASE_DB_URL" postgres:17 sh -c "$1"; }
          {
            echo "-- Ausgangsstand der Datenbank von IMMOBIL, erzeugt vom Workflow schema.yml."
            echo "-- Nicht von Hand ändern; neue Änderungen kommen als weitere Datei 0002_..., 0003_... dazu."
            echo "-- Voraussetzung: Supabase (Cloud oder selbst gehostet) mit den Schemas auth, storage, extensions."
            echo
            echo "-- Das Supabase-Image gibt neuen Tabellen, Folgen und Funktionen in public alle Rechte für anon und"
            echo "-- authenticated. Diese Standardrechte werden vorher zurückgenommen, damit nur die unten ausdrücklich"
            echo "-- vergebenen Rechte gelten (siehe supabase/verlauf/rechte_absichern.sql)."
            echo "alter default privileges for role postgres in schema public revoke all on tables from anon, authenticated;"
            echo "alter default privileges for role postgres in schema public revoke all on sequences from anon, authenticated;"
            echo "alter default privileges for role postgres in schema public revoke all on functions from anon, authenticated;"
            echo
            # Schemas public (mit PostGIS) und privat; ohne Eigentümer, Rechte (grant) bleiben enthalten.
            # \restrict-Zeilen enthalten bei jedem Lauf einen neuen Zufallsschlüssel und werden entfernt;
            # public gibt es in jeder Supabase-Datenbank schon, daher CREATE SCHEMA IF NOT EXISTS. Die Standardrechte
            # der Rolle supabase_admin bringt Supabase selbst mit (und nur supabase_admin dürfte sie setzen).
            pg 'pg_dump "$DB" --schema-only --no-owner -n public -n privat -e postgis' | grep -v -E '^\\(un)?restrict ' \
              | sed -E 's/^CREATE SCHEMA ([a-z_]+);/CREATE SCHEMA IF NOT EXISTS \1;/' \
              | sed -E '/^ALTER DEFAULT PRIVILEGES FOR ROLE supabase_admin /d'
            echo
            echo "-- Speicher für Inseratsfotos und seine Regeln (Schema storage gehört Supabase)"
            pg 'psql "$DB" -XAt -v ON_ERROR_STOP=1' <<'SQL'
          select format('insert into storage.buckets (id, name, public, file_size_limit, allowed_mime_types) values (%L, %L, %L, %s, %L) on conflict (id) do nothing;',
                        id, name, public, coalesce(file_size_limit::text, 'null'), allowed_mime_types)
            from storage.buckets order by id;
          select format('create policy %I on storage.objects as %s for %s to %s%s%s;',
                        policyname, lower(permissive), lower(cmd), array_to_string(roles, ', '),
                        case when qual is not null then ' using (' || qual || ')' else '' end,
                        case when with_check is not null then ' with check (' || with_check || ')' else '' end)
            from pg_policies where schemaname = 'storage' and tablename = 'objects' order by policyname;
          select '';
          select '-- Einstellungen der Rollen (Zeitlimits, Prüfung vor jeder Anfrage über die Schnittstelle)';
          select format('alter role %I set %s;', r.rolname, regexp_replace(c, '^([^=]+)=(.*)$', '\1 = ''\2'''))
            from pg_db_role_setting s join pg_roles r on r.oid = s.setrole, unnest(s.setconfig) c
           where r.rolname in ('anon', 'authenticated', 'authenticator')
             and (c like 'statement_timeout=%' or c like 'pgrst.%')
           order by r.rolname, c;
          select 'notify pgrst, ''reload config'';';
          SQL
          } > "$ziel"
          echo "$(wc -l < "$ziel") Zeilen, $(grep -ciE '^create (table|function|policy|trigger)' "$ziel") Tabellen/Funktionen/Regeln/Trigger" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: In den Branch committen
        run: |
          git add supabase/migrations
          if git diff --cached --quiet; then echo "Keine Änderung am Aufbau" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Datenbank-Aufbau als Migration gesichert"
          git push origin "HEAD:${GITHUB_REF_NAME}"
