name: Deploy to GitHub Pages

# Das Skript startet automatisch, wenn du auf den "main" Branch pushst
on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Bezirksdaten holen
        # vom Workflow "Bezirksdaten erzeugen"; fehlt der Branch, fragt die Seite Overpass/Nominatim
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gebiete
          path: gebiete-daten

      - name: Bezirksdaten in die Seite legen
        run: |
          if [ -f gebiete-daten/stand.json ]; then
            mkdir -p public/gebiete && cp -r gebiete-daten/l gebiete-daten/g gebiete-daten/stand.json public/gebiete/
            # Ortssuche (o/) gibt es erst seit Oktober 2026; fehlt sie, fragt die Seite Photon
            if [ -d gebiete-daten/o ]; then cp -r gebiete-daten/o public/gebiete/; fi
          fi
          rm -rf gebiete-daten

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Oder die Node-Version, die du nutzt
          
      - name: Install dependencies
        run: npm install
        
      - name: Build Project
        env:
          # Links steht der Name für Next.js, rechts der Name deines GitHub Secrets
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Spamschutz (Cloudflare Turnstile), öffentlicher Schlüssel als Repository-Variable; leer = aus
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: npm run build
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # WICHTIG: Wenn du Vite nutzt, heißt der Ordner './dist'. 
          # Wenn du Create React App nutzt, ändere das hier zu './build'
          path: './out' 
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4