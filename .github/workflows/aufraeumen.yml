name: Datenbank aufräumen

# Löscht täglich die gehashten IP-Zähler des Spamschutzes (supabase/verlauf/moderation_konto_spam.sql),
# die nach einem Tag nicht mehr gebraucht werden, und erledigte Meldungen ein Jahr nach ihrer Erledigung
# (Datenschutzerklärung Abschnitt 6, supabase/migrations/0003_meldungen_erledigt_am.sql).
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read

jobs:
  aufraeumen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: psql bereitstellen
        # auf GitHub schon da; in Forgejo-Runnern (Debian/Ubuntu-Container) wird es nachinstalliert
        run: |
          command -v psql >/dev/null && exit 0
          als_root() { if command -v sudo >/dev/null; then sudo "$@"; else "$@"; fi; }
          als_root apt-get update -q && als_root apt-get install -y -q postgresql-client

      - name: Spamschutz-Zähler löschen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "Secret SUPABASE_DB_URL fehlt"; exit 1; fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "delete from privat.drossel where zeit < now() - interval '1 day'"

      - name: Erledigte Meldungen nach einem Jahr löschen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "Secret SUPABASE_DB_URL fehlt"; exit 1; fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "delete from public.meldungen where erledigt and erledigt_am < now() - interval '1 year'"
