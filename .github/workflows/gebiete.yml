name: Bezirksdaten erzeugen

# Baut aus OpenStreetMap (Geofabrik-Auszug Deutschland) die Dateien für Ortssuche und Bezirksfilter
# und legt sie auf den Branch "gebiete". Der Deploy holt sie von dort nach public/gebiete.
on:
  workflow_dispatch:
    inputs:
      ziel:
        description: 'Ziel-Branch (zum Ausprobieren z. B. gebiete-test)'
        default: 'gebiete'
  schedule:
    - cron: '0 3 1 * *'   # monatlich, Grenzen ändern sich selten
  push:
    branches: ["gebiete-erzeugen"]

permissions:
  contents: write

jobs:
  erzeugen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge installieren
        run: |
          # sudo fehlt in Forgejo-Runnern, die als root im Container laufen
          als_root() { if command -v sudo >/dev/null; then sudo "$@"; else "$@"; fi; }
          als_root apt-get update -q && als_root apt-get install -y -q osmium-tool python3-pip
          pip install shapely==2.0.6 || pip install --break-system-packages shapely==2.0.6

      - name: OpenStreetMap-Auszug laden und Grenzen herausfiltern
        run: |
          curl -sSfL -o deutschland.osm.pbf https://download.geofabrik.de/europe/germany-latest.osm.pbf
          osmium tags-filter deutschland.osm.pbf r/boundary=administrative,postal_code -o grenzen.osm.pbf
          rm deutschland.osm.pbf
          osmium export grenzen.osm.pbf -f geojsonseq --geometry-types=polygon --add-unique-id=type_id -o grenzen.geojsonseq

      - name: Dateien bauen
        run: python3 scripts/gebiete/gebiete_bauen.py grenzen.geojsonseq ausgabe

      - name: Auf Branch "gebiete" ablegen
        env:
          ZIEL: ${{ inputs.ziel || 'gebiete' }}
        run: |
          cd ausgabe
          git init -q -b "$ZIEL"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Bezirksdaten $(date -u +%F)"
          # server_url statt fest github.com, damit es auch mit Forgejo läuft
          server="${{ github.server_url }}"
          git push -f "${server/:\/\//://x-access-token:${{ github.token }}@}/${{ github.repository }}.git" "$ZIEL"
